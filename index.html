<html>
  <head>
    <meta charset="UTF-8" />
    <title>IP Country Checker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="index.css" />
    <script defer src="index.js"></script>
  </head>
  <body>
    <div class="pageContainer">
      <div class="headline">
        <img src="logo.svg" alt="Logo" width="200" />
        <span> IP Country Checker </span>
      </div>

      <form id="ipForm" class="ipForm" autocomplete="off">
        <input
          id="ipInput"
          class="ipInput"
          type="text"
          inputmode="text"
          placeholder="Enter IPv4 or IPv6 (optional)"
          aria-label="IP address"
        />
        <button type="submit" class="button">Check</button>
        <button type="button" id="useMyIpBtn" class="outlineButton">
          Use my IP
        </button>
      </form>

      <div class="helperText">
        Leave empty to detect your current public IP automatically.
      </div>

      <div id="result" class="resultCard" aria-live="polite"></div>
    </div>

    <footer>
      Data from
      <a href="https://ipapi.co/" target="_blank" rel="noreferrer">ipapi.co</a>
      and
      <a href="https://ipwho.is/" target="_blank" rel="noreferrer">ipwho.is</a>.
    </footer>
  </body>
</html>
